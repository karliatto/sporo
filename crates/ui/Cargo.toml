[package]
name = "sporo-ui"
version = "0.1.0"
edition = "2021"
description = "The screens, drawn against embedded-graphics — no chip dependencies"
publish = false

[dependencies]
# What the screens display: entry state, the alphabet they draw, the mnemonic.
sporo-core = { path = "../core" }

# The drawing surface. Screens are generic over `DrawTarget`, which is what lets
# them render to a real panel and to a test buffer alike.
embedded-graphics = "0.8.2"

# Large bitmap faces for the brand mark. embedded-graphics' own fonts stop at
# 10x20, too small, and u8g2's renderer has the alignment anchors the C++ screen
# code gets from TFT_eSPI's datums.
u8g2-fonts = "0.8.0"

# Fixed-capacity String, so text is composed without a heap allocator.
heapless = "0.9.3"

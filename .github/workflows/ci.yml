name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (xtensa-esp32-none-elf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The ESP32 is Xtensa, so the toolchain comes from Espressif's fork.
      # Puts xtensa-esp32-elf-gcc on PATH, which build.rs checks for.
      #
      # `version` and `name` must match the pin in rust-toolchain.toml and the
      # ESP_RUST_VERSION in flake.nix. The action defaults to version `latest`
      # installed as `esp`, both of which would break us: `latest` drifts, so
      # the firmware would stop being reproducible, and the bare `esp` name
      # would not satisfy the override in rust-toolchain.toml.
      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          version: 1.95.0.0
          name: esp-1.95.0.0
          buildtargets: esp32 # skip esp32s2/esp32s3, we only build esp32
          ldproxy: false # only needed for std / esp-idf builds

      - name: Verify toolchain pin
        run: |
          expected=1.95.0.0
          actual=$(rustc --version)
          case "$actual" in
            *"($expected)"*) echo "toolchain pin ok: $actual" ;;
            *) echo "::error::expected Xtensa Rust $expected, got: $actual"; exit 1 ;;
          esac

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt-check

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Clippy
        run: make clippy

  build-nix:
    name: reproducible build (nix develop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # espup installs outside the Nix store -- into ~/.rustup and ~/.espressif
      # -- so flake.lock cannot pin it and every run would otherwise re-download
      # it. Keyed on flake.nix, which holds both version pins: bumping the
      # toolchain changes the key and refills the cache.
      - name: Cache Xtensa toolchain
        id: esp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.espressif
            ~/export-esp.sh
          key: esp-toolchain-${{ runner.os }}-${{ hashFiles('flake.nix') }}

      - name: Install Xtensa toolchain
        if: steps.esp-cache.outputs.cache-hit != 'true'
        run: nix run .#install-esp-toolchain

      - name: Format
        run: nix develop --command make fmt-check

      - name: Test
        run: nix develop --command make test

      - name: Clippy
        run: nix develop --command make clippy

      - name: Reproducible build
        run: nix develop --command make check-reproducible

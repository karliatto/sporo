# Host workspace: everything that is *not* tied to a chip, so `cargo test` here
# runs with no flags.
#
# The firmware lives in its own workspace (firmware/Cargo.toml) because the
# Xtensa target and `build-std` are set in .cargo/config.toml, which Cargo
# applies workspace-wide. Sharing one workspace would cross-compile these tests
# too, which is exactly what the split exists to avoid.
[workspace]
resolver = "2"
members = ["crates/core", "crates/ui"]

[profile.release]
opt-level = "s"
